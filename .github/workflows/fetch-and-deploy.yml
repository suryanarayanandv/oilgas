name: Fetch jobs and deploy

on:
  schedule:
    - cron: "17 */8 * * *"   # every 8 hours
  workflow_dispatch: {}        # "Run workflow" button (the site's "Fetch now" link)
  push:
    branches: [main]
    paths: ["web/**", "shared/**", "data/**", "fetcher/**"]

permissions:
  contents: write   # commit the refreshed snapshot
  pages: write
  id-token: write

concurrency:
  group: fetch-and-deploy
  cancel-in-progress: false

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rebuild company list
        run: npm run build:companies

      - name: Fetch jobs from every career site
        # Code-only pushes redeploy without re-scanning; schedule and manual runs scan.
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[fetch]')
        run: npm run fetch

      - name: Commit snapshot
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[fetch]')
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add web/public/data data/companies.json
          git diff --cached --quiet || (git commit -m "data: refresh job snapshot" && git push)

      - name: Build site
        run: npm run build
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
